name: One-time jsPDF lockfile update
on:
  push:
    branches:
      - security/jspdf-4-2-1

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.repository == 'aniket-r2Dev2/voca'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/jspdf-4-2-1
      - name: Set up Node 20 and npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Upgrade patched jsPDF and regenerate full lockfile
        run: npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund jspdf@4.2.1
      - name: Confirm lockfile pins patched jsPDF
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.dependencies.jspdf !== '4.2.1' ||
              lock.packages[''].dependencies.jspdf !== '4.2.1' ||
              lock.packages['node_modules/jspdf'].version !== '4.2.1') {
            throw new Error('Package manifest and lockfile are not both pinned to patched jsPDF');
          }
          console.log('jspdf = 4.2.1 in package manifest and lockfile');
          NODE
      - name: Commit regenerated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): upgrade vulnerable jsPDF to 4.2.1"
            git push origin HEAD:security/jspdf-4-2-1
          else
            echo "Dependencies already updated."
          fi
