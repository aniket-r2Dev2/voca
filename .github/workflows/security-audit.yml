name: Dependency Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate dependency audit report
        shell: bash
        run: |
          set -uo pipefail
          audit_exit=0
          npm audit --json > npm-audit-report.json || audit_exit=$?
          echo "$audit_exit" > npm-audit-exit-code.txt
          node -e "const r=require('./npm-audit-report.json'); console.log(JSON.stringify({vulnerabilities:r.metadata?.vulnerabilities,advisories:Object.entries(r.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}))},null,2))"
          if [ "$audit_exit" -ne 0 ]; then
            echo "::warning::npm audit found dependency advisories. Review the uploaded report before release."
          fi
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: |
            npm-audit-report.json
            npm-audit-exit-code.txt
          if-no-files-found: warn
          retention-days: 14
